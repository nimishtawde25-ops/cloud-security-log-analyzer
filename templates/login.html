<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Cloud Security Log Analyzer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 20px;
        }

        .login-box {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;

            text-align: center;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #555;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            background: #ffe5e5;

            color: #b00020;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;
        }

        .security {
            margin-top: 25px;

            text-align: center;

            color: #777;

            font-size: 13px;
        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-box">

            <h1>
                🔐 Security Login
            </h1>

            <p class="subtitle">
                Cloud Security Log Analyzer
            </p>


            {% if error %}

            <div class="error">

                {{ error }}

            </div>

            {% endif %}


            <form
                method="POST"
                action="/login"
            >


                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >


                <button type="submit">
                    Login
                </button>


            </form>


            <div class="security">

                🛡️ Authorized access only

            </div>

        </div>

    </div>


</body>

</html>
